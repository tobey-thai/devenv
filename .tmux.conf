set -g mode-keys vi
set -g set-titles on
set -sg escape-time 100

unbind C-o
unbind M-o

set -g prefix C-M-j
unbind-key C-b

bind-key | split-window -h
bind-key - split-window -v

set -g allow-passthrough on # allows copying in opencode
set -g set-clipboard on # allows tmux to set system clipboard

set -g status-style "bg=colour146,fg=black"
set -g window-status-current-style "bg=colour98,fg=white,bold"

# opencode state: style and marker, defined once
set -g @oc_style "#{?#{==:#{@oc_state},busy},bg=colour71#,fg=black,#{?#{==:#{@oc_state},waiting},bg=colour160#,fg=white#,bold,#{?#{==:#{@oc_state},done},bg=colour220#,fg=black#,bold,default}}}"
set -g @oc_mark  "#{?#{==:#{@oc_state},busy},>,#{?#{==:#{@oc_state},waiting},?,#{?#{==:#{@oc_state},done},+,}}}"

set -g window-status-style "#{E:@oc_style}"
set -g window-status-format         "#I:#W#{?window_flags,#{window_flags}, }#{E:@oc_mark}"
set -g window-status-current-format "#I:#W#{?window_flags,#{window_flags}, }#{E:@oc_mark}"

# on arriving at a window, recompute its state from the opencode panes' states
set-hook -g after-select-window 'set-option -wF @oc_state "#{?#{m:*waiting*,#{P:#{?#{==:#{pane_current_command},opencode},#{@oc_pane},} }},waiting,#{?#{m:*busy*,#{P:#{?#{==:#{pane_current_command},opencode},#{@oc_pane},} }},busy,}}"'
